<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบดึง API ระบบบัญชีข้อมูลจังหวัด</title>
<style>
  body{font-family:system-ui,"Noto Sans Thai",sans-serif;margin:0;padding:16px;background:#0f172a;color:#e2e8f0}
  .bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .pill{background:#1e293b;padding:6px 12px;border-radius:999px;font-size:13px}
  .err{background:#7f1d1d;padding:10px;border-radius:8px;margin-bottom:12px;white-space:pre-wrap}
  .wrap{overflow-x:auto;max-height:70vh;border:1px solid #334155;border-radius:8px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:6px 10px;border-bottom:1px solid #334155;text-align:left;white-space:nowrap}
  th{position:sticky;top:0;background:#1e293b}
</style>
</head>
<body>
<div class="bar">
  <div class="pill" id="count">รายการ: -</div>
  <div class="pill" id="time">อัปเดตล่าสุด: -</div>
  <div class="pill" id="src">แหล่ง: -</div>
</div>
<div id="err"></div>
<div class="wrap"><table id="tbl"></table></div>

<script>
const BASE = "https://nongbualamphu.gdcatalog.go.th/api/3/action/datastore_search";
const RESOURCE_ID = "909bac40-1ce7-4765-b7cb-6114bf375292";
const PROXY_URL = "";          // ถ้าโดน CORS ให้ใส่ URL ของ GAS proxy ตรงนี้
const REFRESH_MS = 60000;      // รีเฟรชทุก 60 วินาที
const PAGE = 1000;

async function fetchAll(){
  let rows = [], offset = 0, total = Infinity;
  while(offset < total){
    const target = `${BASE}?resource_id=${RESOURCE_ID}&limit=${PAGE}&offset=${offset}`;
    const url = PROXY_URL ? `${PROXY_URL}?url=${encodeURIComponent(target)}` : target;
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    if(!j.success) throw new Error(JSON.stringify(j.error||j));
    total = j.result.total;
    rows = rows.concat(j.result.records);
    if(!j.result.records.length) break;
    offset += PAGE;
  }
  return rows;
}

function render(rows){
  const cols = rows.length ? Object.keys(rows[0]) : [];
  const t = document.getElementById("tbl");
  t.innerHTML = "<thead><tr>" + cols.map(c=>`<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
    rows.slice(0,500).map(r=>"<tr>"+cols.map(c=>`<td>${r[c]??""}</td>`).join("")+"</tr>").join("") + "</tbody>";
  document.getElementById("count").textContent = "รายการ: " + rows.length.toLocaleString();
}

async function load(){
  try{
    const rows = await fetchAll();
    render(rows);
    document.getElementById("err").innerHTML = "";
    document.getElementById("time").textContent = "อัปเดตล่าสุด: " + new Date().toLocaleTimeString("th-TH");
    document.getElementById("src").textContent = "แหล่ง: " + (PROXY_URL ? "ผ่าน proxy" : "API ตรง");
  }catch(e){
    document.getElementById("err").innerHTML =
      `<div class="err">ดึงข้อมูลไม่สำเร็จ: ${e.message}\nถ้าเป็น "Failed to fetch" มักเป็น CORS → ใส่ PROXY_URL</div>`;
  }
}
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
